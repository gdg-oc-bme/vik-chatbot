[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vik-chatbot"
version = "0.1.0"
description = "RAG-powered assistant that answers BME VIK students' university questions with cited sources."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "GDG on Campus BME" }]

# Core runtime: API, chat service, retrieval, DB, ingestion.
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",          # Server-Sent Events for streamed answers
    "slowapi>=0.1.9",              # rate limiting
    # Config & validation
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # LLM (Gemini chat + embeddings)
    "google-genai>=1.0",
    "tenacity>=8.5",               # retries with backoff
    # Database: PostgreSQL + pgvector
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    # Ingestion
    "pdfplumber>=0.11",            # PDF text + tables per page (MIT)
    "httpx>=0.27",                 # fetching faculty web pages
    "beautifulsoup4>=4.12",
    "typer>=0.12",                 # CLI
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.38",
    "httpx>=0.27",
]
tracing = [
    "langfuse>=2.50",              # or swap for "langsmith" if we pick LangSmith
]
eval = [
    "pandas>=2.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",                 # mock outbound HTTP (Gemini, web sources)
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

# TODO: enable once the modules exist.
# [project.scripts]
# vik-ingest = "vik_chatbot.ingestion.cli:app"
# vik-api    = "vik_chatbot.api.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/vik_chatbot"]

# ---------------------------------------------------------------- tooling

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a running Postgres + pgvector (docker compose up postgres)",
]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["vik_chatbot"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
